name: CI

# master 向け PR と、master / feature 系ブランチへの push で
# 自動テスト・Lint・型チェック・ビルドを実行する。
# feature の push 時点で落ちに気づけるよう push も対象にしつつ、
# PR では master へマージした状態を検証する。
on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - 'feature/**'

# 同一ブランチの重複実行を 1 本に集約する。
# group を head_ref(=PRの元ブランチ) || ref_name(=pushのブランチ) で組むことで、
# 「feature への push」と「その feature からの PR」が同じグループになり、
# 二重実行・連続 push の古い run が自動キャンセルされる。
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# lint/test/build は読み取りのみで足りるため最小権限を明示する。
permissions:
  contents: read

jobs:
  # フロントエンド（React + Vite + TypeScript）の検証ジョブ。
  # backend（C# / xUnit）は将来別ジョブとして追加する。
  frontend:
    name: Frontend (lint / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # package-lock.json を元に npm キャッシュを効かせる
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # lockfile 厳密インストール（CI では install ではなく ci を使う）
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # tsc 型チェック + vite 本番ビルド
      - name: Build
        run: npm run build
